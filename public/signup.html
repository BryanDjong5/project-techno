<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - Gem Station</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Exo+2:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body class="auth-page">

<nav class="nav">
  <a class="nav-logo auth-home-link" href="index.html">GEM STATION</a>
  <div class="nav-links">
    <a class="nav-link auth-home-link" href="index.html">Beranda</a>
  </div>
</nav>

<main class="auth-shell">
  <section class="auth-panel">
    <div class="auth-brand">
      <div class="auth-logo">GS</div>
      <div>
        <div class="auth-eyebrow">Gem Station Account</div>
        <h1 class="auth-title">Buat akun baru</h1>
      </div>
    </div>

    <div class="auth-switch">
      <a href="login.html">Login</a>
      <a class="active" href="signup.html">Sign Up</a>
    </div>

    <form class="auth-form" id="signup-form">
      <label class="auth-field">
        <span>Username</span>
        <input type="text" id="signup-name" placeholder="Nickname gamer" autocomplete="username" required minlength="3" />
      </label>
      <label class="auth-field">
        <span>Email</span>
        <input type="email" id="signup-email" placeholder="nama@email.com" autocomplete="email" required />
      </label>
      <label class="auth-field">
        <span>Password</span>
        <input type="password" id="signup-password" placeholder="Minimal 6 karakter" autocomplete="new-password" required minlength="6" />
      </label>
      <button class="auth-submit" onclick="registerPengguna()" type="submit"><i class="ti ti-user-plus"></i> Buat Akun</button>
    </form>

    <div class="auth-message" id="auth-message" aria-live="polite"></div>
    <p class="auth-footnote">Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
  </section>
</main>

<script src="auth.js"></script>
</body>
</html>
