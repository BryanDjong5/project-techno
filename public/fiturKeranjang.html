<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gem Station - Keranjang Belanja</title>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Exo 2', sans-serif;
            background: #0a0b14;
            color: #e8eaf6;
            min-height: 100vh;
        }

        .nav {
            background: #0d0f1c;
            border-bottom: 1px solid rgba(80,120,255,0.18);
            padding: 0 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            height: 60px;
        }
        .nav-logo {
            font-family: 'Rajdhani', sans-serif;
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(90deg, #3a8eff, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-back {
            color: #8892b0;
            text-decoration: none;
            font-size: 13px;
            margin-left: auto;
        }
        .nav-back:hover { color: #3a8eff; }

        .container {
            max-width: 900px;
            margin: 32px auto;
            padding: 0 24px;
        }
        .page-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .page-title span { color: #3a8eff; }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #8892b0;
        }
        .empty-icon { font-size: 64px; margin-bottom: 16px; }
        .empty-text {
            font-size: 16px;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .btn-shop {
            background: linear-gradient(135deg, #3a8eff, #8b5cf6);
            color: white;
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            font-family: 'Exo 2', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-login {
            background: transparent;
            border: 1px solid rgba(58,142,255,0.4);
            color: #3a8eff;
            padding: 10px 24px;
            border-radius: 8px;
            font-family: 'Exo 2', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-login:hover { background: rgba(58,142,255,0.1); }

        #daftar-belanja { margin-bottom: 24px; }

        .cart-item {
            background: #161928;
            border: 1px solid rgba(80,120,255,0.18);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
            transition: border-color 0.15s;
        }
        .cart-item:hover { border-color: rgba(58,142,255,0.4); }
        .cart-icon {
            width: 56px;
            height: 56px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            flex-shrink: 0;
            background: linear-gradient(135deg, #1a1a2e, #2a2a4e);
        }
        .cart-info { flex: 1; }
        .cart-game {
            font-size: 10px;
            color: #8892b0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }
        .cart-name {
            font-size: 14px;
            font-weight: 600;
            color: #e8eaf6;
            margin-bottom: 4px;
        }
        .cart-price {
            font-family: 'Rajdhani', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: #3a8eff;
        }
        .cart-qty {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .qty-btn {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: 1px solid rgba(80,120,255,0.3);
            background: #1a1d2e;
            color: #e8eaf6;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }
        .qty-btn:hover { background: rgba(58,142,255,0.2); }
        .qty-val {
            font-weight: 700;
            font-size: 14px;
            min-width: 20px;
            text-align: center;
        }
        .cart-delete {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 18px;
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            transition: background 0.15s;
        }
        .cart-delete:hover { background: rgba(239,68,68,0.1); }

        .summary {
            background: #161928;
            border: 1px solid rgba(80,120,255,0.18);
            border-radius: 12px;
            padding: 20px;
        }
        .summary-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #e8eaf6;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #8892b0;
            margin-bottom: 10px;
        }
        .summary-row.total {
            border-top: 1px solid rgba(80,120,255,0.18);
            padding-top: 12px;
            margin-top: 4px;
            font-size: 16px;
            font-weight: 700;
            color: #3a8eff;
            font-family: 'Rajdhani', sans-serif;
        }
        .btn-checkout {
            width: 100%;
            margin-top: 16px;
            padding: 14px;
            background: linear-gradient(135deg, #3a8eff, #8b5cf6);
            color: white;
            font-family: 'Exo 2', sans-serif;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .btn-checkout:hover { opacity: 0.9; }
        .btn-clear {
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            background: transparent;
            color: #8892b0;
            font-family: 'Exo 2', sans-serif;
            font-size: 13px;
            border: 1px solid rgba(80,120,255,0.18);
            border-radius: 10px;
            cursor: pointer;
        }
        .btn-clear:hover { color: #ef4444; border-color: #ef4444; }
    </style>
</head>
<body>

<div class="nav">
    <div class="nav-logo">💎 GEM STATION</div>
    <a class="nav-back" href="/">← Lanjut Belanja</a>
</div>

<div class="container">
    <div class="page-title">🛒 Keranjang <span>Belanja</span></div>

    <div class="empty" id="emptyState" style="display:block">
        <div class="empty-icon">🛒</div>
        <div class="empty-text">Memuat keranjang...</div>
    </div>

    <div id="daftar-belanja"></div>

    <div class="summary" id="summary" style="display:none">
        <div class="summary-title">Ringkasan Pesanan</div>
        <div class="summary-row">
            <span>Subtotal</span>
            <span id="subtotal">Rp 0</span>
        </div>
        <div class="summary-row">
            <span>Biaya Layanan</span>
            <span>Rp 0</span>
        </div>
        <div class="summary-row total">
            <span>Total</span>
            <span id="total">Rp 0</span>
        </div>
        <button class="btn-checkout" onclick="checkout()">Checkout Sekarang</button>
        <button class="btn-clear" onclick="clearCart()">Kosongkan Keranjang</button>
    </div>
</div>
